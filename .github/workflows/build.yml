name: Build PixelDialer APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Decode Firebase config from GitHub Secret
      - name: Decode google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "❌ GOOGLE_SERVICES_JSON secret is empty or not set."
            echo "Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

          echo "✅ app/google-services.json written ($(wc -c < app/google-services.json) bytes)"

      # Install Gradle 8.7
      - name: Generate Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate wrapper files
        run: gradle wrapper --gradle-version 8.7

      - name: Make Gradle executable
        run: chmod +x gradlew

      # Build APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Print SHA-1 if debug keystore exists.
      # This step can NEVER block APK upload.
      - name: Print debug keystore SHA-1 (for Firebase Console)
        continue-on-error: true
        run: |
          echo ""
          echo "=================================================================="
          echo "  Firebase Debug SHA-1"
          echo "=================================================================="

          KEYSTORE="$HOME/.android/debug.keystore"

          if [ -f "$KEYSTORE" ]; then
            echo "✅ debug.keystore found."

            keytool -list -v \
              -keystore "$KEYSTORE" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android 2>/dev/null | grep -E "SHA1:|SHA-1:" || true

          else
            echo "⚠️ debug.keystore was not found."
            echo "APK build succeeded, so continuing to APK upload."
          fi

          echo "=================================================================="

      # Upload generated APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelDialer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error