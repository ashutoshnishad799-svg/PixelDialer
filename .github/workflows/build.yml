name: Build PixelDialer APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Decodes the GOOGLE_SERVICES_JSON repo secret back into a real file
      # at app/google-services.json — the exact path/name the Google
      # Services Gradle plugin expects. This runs BEFORE the build step so
      # the file exists when Gradle needs it, and the file only ever lives
      # on the (ephemeral, private) CI runner's disk — never committed,
      # never visible in logs, gone the moment the job finishes.
      - name: Decode google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "❌ GOOGLE_SERVICES_JSON secret is empty or not set."
            echo "   Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          echo "✅ app/google-services.json written ($(wc -c < app/google-services.json) bytes)"

      - name: Generate Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate wrapper files
        run: gradle wrapper --gradle-version 8.7

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Prints the SHA-1 of the keystore this CI run just signed the debug
      # APK with. Firebase Google Sign-In checks this fingerprint against
      # what's registered in the Firebase Console — a CI-built APK is
      # signed with a keystore Gradle auto-generates on the runner (NOT
      # your local Android Studio debug keystore), so sign-in will fail on
      # this APK specifically until this SHA-1 is added to the Firebase
      # Console too (Project settings → Your apps → Add fingerprint).
      - name: Print debug keystore SHA-1 (for Firebase Console)
        run: |
          echo ""
          echo "=================================================================="
          echo "  Add this SHA-1 to Firebase Console → Project settings →"
          echo "  Your apps → (this Android app) → Add fingerprint"
          echo "  so Google Sign-In works on APKs built by THIS workflow."
          echo "=================================================================="
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android 2>/dev/null | grep "SHA1:"
          echo "=================================================================="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelDialer-debug
          path: app/build/outputs/apk/debug/*.apk
